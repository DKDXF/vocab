<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VocabMaster - 智能英语单词学习</title>
<style>
/* ========== Reset & Base ========== */
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:#f0f2f5;color:#2c3e50;line-height:1.6;min-height:100vh;overflow-x:hidden}
a{text-decoration:none;color:inherit}
button{border:none;cursor:pointer;font-family:inherit;font-size:inherit}
input{font-family:inherit;font-size:inherit}
ul,ol{list-style:none}

/* ========== CSS Variables ========== */
:root{
  --primary:#3a5ba0;
  --primary-light:#5a7bc0;
  --primary-dark:#2a4580;
  --primary-bg:#eef2f9;
  --success:#27ae60;
  --success-light:#2ecc71;
  --warning:#e67e22;
  --danger:#e74c3c;
  --info:#3498db;
  --bg:#f0f2f5;
  --card:#ffffff;
  --text:#2c3e50;
  --text-secondary:#7f8c8d;
  --text-muted:#bdc3c7;
  --border:#e8ecf1;
  --shadow:0 2px 12px rgba(44,62,80,0.08);
  --shadow-lg:0 4px 24px rgba(44,62,80,0.12);
  --radius:12px;
  --radius-sm:8px;
  --nav-height:60px;
}

/* ========== Layout ========== */
.app-container{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}
.page{display:none;padding:16px;padding-bottom:calc(var(--nav-height) + 24px);min-height:100vh;animation:fadeIn .3s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ========== Top Bar ========== */
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 0;margin-bottom:16px}
.top-bar h1{font-size:1.3rem;font-weight:700;color:var(--primary)}
.top-bar .subtitle{font-size:.8rem;color:var(--text-secondary);margin-top:2px}
.streak-badge{display:flex;align-items:center;gap:4px;background:var(--primary-bg);padding:6px 12px;border-radius:20px;font-size:.85rem;font-weight:600;color:var(--primary)}
.streak-badge .fire{font-size:1.1rem}

/* ========== Bottom Navigation ========== */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:var(--nav-height);background:var(--card);display:flex;align-items:center;justify-content:space-around;box-shadow:0 -2px 12px rgba(0,0,0,0.06);z-index:100;border-top:1px solid var(--border)}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 12px;border-radius:var(--radius-sm);transition:all .2s;cursor:pointer;-webkit-tap-highlight-color:transparent}
.nav-item .nav-icon{font-size:1.4rem;line-height:1}
.nav-item .nav-label{font-size:.7rem;color:var(--text-secondary);font-weight:500}
.nav-item.active{color:var(--primary)}
.nav-item.active .nav-label{color:var(--primary);font-weight:600}
.nav-item .nav-badge{position:absolute;top:2px;right:2px;background:var(--danger);color:#fff;font-size:.6rem;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:600}
.nav-item{position:relative}

/* ========== Card ========== */
.card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.card-title{font-size:1rem;font-weight:600;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:8px}

/* ========== Buttons ========== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:var(--radius-sm);font-weight:600;font-size:.9rem;transition:all .2s;-webkit-tap-highlight-color:transparent}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-light)}
.btn-primary:active{transform:scale(.97)}
.btn-success{background:var(--success);color:#fff}
.btn-warning{background:var(--warning);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-outline{background:transparent;border:2px solid var(--primary);color:var(--primary)}
.btn-ghost{background:transparent;color:var(--primary);padding:8px 12px}
.btn-lg{padding:14px 28px;font-size:1rem;border-radius:var(--radius)}
.btn-sm{padding:6px 14px;font-size:.8rem}
.btn-block{width:100%;justify-content:center}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}

/* ========== Progress Bar ========== */
.progress-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.progress-bar .fill{height:100%;border-radius:4px;transition:width .5s ease;background:linear-gradient(90deg,var(--primary),var(--primary-light))}
.progress-text{font-size:.8rem;color:var(--text-secondary);margin-top:4px}

/* ========== Dashboard ========== */
.dashboard-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);text-align:center}
.stat-card .stat-icon{font-size:1.6rem;margin-bottom:4px}
.stat-card .stat-value{font-size:1.5rem;font-weight:700;color:var(--primary)}
.stat-card .stat-label{font-size:.75rem;color:var(--text-secondary);margin-top:2px}

.checkin-section{text-align:center;margin-bottom:16px}
.checkin-btn{width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;font-size:1.1rem;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto;box-shadow:0 4px 20px rgba(58,91,160,0.35);transition:all .3s;cursor:pointer;border:none}
.checkin-btn:hover{transform:scale(1.05);box-shadow:0 6px 28px rgba(58,91,160,0.45)}
.checkin-btn:active{transform:scale(.95)}
.checkin-btn.checked{background:linear-gradient(135deg,var(--success),var(--success-light));box-shadow:0 4px 20px rgba(39,174,96,0.35)}
.checkin-btn .checkin-icon{font-size:2rem;margin-bottom:2px}

.today-tasks{display:flex;flex-direction:column;gap:10px}
.task-item{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--card);border-radius:var(--radius-sm);box-shadow:var(--shadow);cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent}
.task-item:hover{transform:translateX(4px)}
.task-item:active{transform:scale(.98)}
.task-left{display:flex;align-items:center;gap:12px}
.task-left .task-icon{font-size:1.3rem}
.task-info .task-name{font-weight:600;font-size:.9rem}
.task-info .task-desc{font-size:.75rem;color:var(--text-secondary)}
.task-right{display:flex;align-items:center;gap:6px}
.task-count{font-size:1.1rem;font-weight:700;color:var(--primary)}
.task-arrow{color:var(--text-muted);font-size:.9rem}

/* ========== Learning Page ========== */
.learn-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.learn-progress{font-size:.85rem;color:var(--text-secondary)}
.learn-close{width:36px;height:36px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.1rem;transition:all .2s}
.learn-close:hover{background:#ddd}

.word-card-container{perspective:1000px;margin-bottom:20px}
.word-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-lg);min-height:340px;padding:28px 24px;position:relative;transition:transform .6s;transform-style:preserve-3d;cursor:pointer}
.word-card.flipped{transform:rotateY(180deg)}
.word-card .front,.word-card .back{backface-visibility:hidden}
.word-card .back{transform:rotateY(180deg);position:absolute;top:0;left:0;width:100%;height:100%;padding:28px 24px;display:flex;flex-direction:column;justify-content:center}

.word-main{text-align:center;margin-bottom:20px}
.word-text{font-size:2.2rem;font-weight:700;color:var(--text);margin-bottom:6px;letter-spacing:1px}
.word-phonetic{font-size:1rem;color:var(--text-secondary);font-style:italic;margin-bottom:8px}
.word-pos{display:inline-block;padding:2px 10px;background:var(--primary-bg);color:var(--primary);border-radius:12px;font-size:.8rem;font-weight:500}
.word-speak-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:var(--primary-bg);color:var(--primary);font-size:1.3rem;cursor:pointer;transition:all .2s;margin-top:8px;border:none}
.word-speak-btn:hover{background:var(--primary);color:#fff}
.word-speak-btn:active{transform:scale(.9)}
.word-speak-btn.speaking{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

.word-detail{margin-top:16px}
.word-definition{font-size:1.2rem;font-weight:600;color:var(--text);margin-bottom:12px;padding:12px;background:var(--primary-bg);border-radius:var(--radius-sm);border-left:4px solid var(--primary)}
.word-example{font-size:.9rem;color:var(--text-secondary);line-height:1.7}
.word-example .en{font-style:italic;color:var(--text);margin-bottom:4px}
.word-example .zh{font-size:.85rem}

.learn-actions{display:flex;gap:10px;margin-top:20px}
.learn-actions .btn{flex:1}

.tap-hint{text-align:center;font-size:.8rem;color:var(--text-muted);margin-top:12px;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}

/* ========== Review Page ========== */
.review-mode-selector{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.mode-card{display:flex;align-items:center;gap:14px;padding:16px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent;border:2px solid transparent}
.mode-card:hover{border-color:var(--primary-light);transform:translateY(-2px)}
.mode-card:active{transform:scale(.98)}
.mode-card .mode-icon{font-size:2rem;width:48px;text-align:center}
.mode-card .mode-info .mode-name{font-weight:600;font-size:.95rem}
.mode-card .mode-info .mode-desc{font-size:.78rem;color:var(--text-secondary)}
.mode-card .mode-count{margin-left:auto;font-size:.85rem;color:var(--primary);font-weight:600;white-space:nowrap}

.review-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:0 4px}
.review-count{font-size:.85rem;color:var(--text-secondary)}

.review-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:24px;margin-bottom:16px}
.review-question{font-size:1.3rem;font-weight:700;text-align:center;margin-bottom:24px;min-height:50px;display:flex;align-items:center;justify-content:center}
.review-question .phonetic-hint{font-size:.9rem;color:var(--text-secondary);font-weight:400;display:block;margin-top:4px}

.choices{display:flex;flex-direction:column;gap:10px}
.choice-btn{padding:14px 16px;background:var(--bg);border:2px solid var(--border);border-radius:var(--radius-sm);text-align:left;font-size:.9rem;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent}
.choice-btn:hover{border-color:var(--primary-light);background:var(--primary-bg)}
.choice-btn:active{transform:scale(.98)}
.choice-btn.correct{border-color:var(--success);background:#e8f8f0;color:var(--success)}
.choice-btn.wrong{border-color:var(--danger);background:#fde8e8;color:var(--danger)}
.choice-btn .choice-label{display:inline-block;width:24px;height:24px;border-radius:50%;background:var(--border);text-align:center;line-height:24px;font-size:.75rem;font-weight:600;margin-right:10px}
.choice-btn.correct .choice-label{background:var(--success);color:#fff}
.choice-btn.wrong .choice-label{background:var(--danger);color:#fff}

.spelling-input{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.spelling-input input{width:100%;padding:14px 16px;font-size:1.2rem;border:2px solid var(--border);border-radius:var(--radius-sm);text-align:center;letter-spacing:2px;outline:none;transition:border-color .2s}
.spelling-input input:focus{border-color:var(--primary)}
.spelling-input input.correct{border-color:var(--success);background:#e8f8f0}
.spelling-input input.wrong{border-color:var(--danger);background:#fde8e8}

.review-feedback{text-align:center;padding:16px;border-radius:var(--radius-sm);margin-top:12px;animation:fadeIn .3s}
.review-feedback.correct{background:#e8f8f0;color:var(--success)}
.review-feedback.wrong{background:#fde8e8;color:var(--danger)}
.review-feedback .feedback-word{font-size:1.1rem;font-weight:700;margin-bottom:4px}
.review-feedback .feedback-def{font-size:.85rem;opacity:.8}

.listen-btn-large{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:32px;background:var(--primary-bg);border-radius:var(--radius);cursor:pointer;transition:all .2s;margin-bottom:20px;border:none;width:100%}
.listen-btn-large:hover{background:var(--primary);color:#fff}
.listen-btn-large .listen-icon{font-size:3rem}
.listen-btn-large .listen-text{font-size:.9rem;font-weight:500}

/* ========== Word Books Page ========== */
.book-card{display:flex;align-items:center;gap:16px;padding:18px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;cursor:pointer;transition:all .2s;border:2px solid transparent;-webkit-tap-highlight-color:transparent}
.book-card:hover{border-color:var(--primary-light);transform:translateY(-1px)}
.book-card.active{border-color:var(--primary);background:var(--primary-bg)}
.book-card .book-icon{font-size:2.2rem;width:52px;text-align:center}
.book-card .book-info{flex:1}
.book-card .book-name{font-weight:700;font-size:1rem;margin-bottom:2px}
.book-card .book-desc{font-size:.78rem;color:var(--text-secondary);margin-bottom:6px}
.book-card .book-progress{font-size:.75rem;color:var(--text-secondary)}
.book-card .book-status{font-size:.75rem;padding:3px 10px;border-radius:12px;font-weight:600;white-space:nowrap}
.book-card .book-status.using{background:var(--primary);color:#fff}
.book-card .book-status.completed{background:var(--success);color:#fff}

/* ========== Statistics Page ========== */
.stats-overview{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stats-overview .stat-item{text-align:center;padding:14px 8px;background:var(--card);border-radius:var(--radius-sm);box-shadow:var(--shadow)}
.stats-overview .stat-item .stat-val{font-size:1.3rem;font-weight:700;color:var(--primary)}
.stats-overview .stat-item .stat-lbl{font-size:.7rem;color:var(--text-secondary);margin-top:2px}

.mastery-distribution{display:flex;height:24px;border-radius:12px;overflow:hidden;margin:8px 0}
.mastery-distribution .seg{transition:width .5s ease;min-width:2px}
.mastery-distribution .seg.new{background:var(--text-muted)}
.mastery-distribution .seg.learning{background:var(--warning)}
.mastery-distribution .seg.familiar{background:var(--info)}
.mastery-distribution .seg.mastered{background:var(--success)}
.mastery-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font-size:.78rem}
.mastery-legend .legend-item{display:flex;align-items:center;gap:4px}
.mastery-legend .legend-dot{width:10px;height:10px;border-radius:50%}
.mastery-legend .legend-dot.new{background:var(--text-muted)}
.mastery-legend .legend-dot.learning{background:var(--warning)}
.mastery-legend .legend-dot.familiar{background:var(--info)}
.mastery-legend .legend-dot.mastered{background:var(--success)}

.calendar-section{margin-top:16px}
.calendar-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calendar-header .month-title{font-weight:600;font-size:.95rem}
.calendar-header button{width:32px;height:32px;border-radius:50%;background:var(--bg);border:none;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all .2s}
.calendar-header button:hover{background:var(--primary-bg);color:var(--primary)}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.calendar-grid .day-label{font-size:.7rem;color:var(--text-muted);padding:4px 0;font-weight:500}
.calendar-grid .day-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:.78rem;border-radius:50%;cursor:default;transition:all .2s}
.calendar-grid .day-cell.empty{cursor:default}
.calendar-grid .day-cell.checked{background:var(--success);color:#fff;font-weight:600}
.calendar-grid .day-cell.today{border:2px solid var(--primary);font-weight:600}

.daily-chart{display:flex;align-items:flex-end;gap:4px;height:80px;margin-top:8px;padding:0 4px}
.daily-chart .chart-bar{flex:1;background:var(--primary);border-radius:4px 4px 0 0;min-width:8px;transition:height .5s ease;position:relative}
.daily-chart .chart-bar:hover{background:var(--primary-light)}
.daily-chart .chart-labels{display:flex;gap:4px;padding:0 4px;margin-top:4px}
.daily-chart .chart-labels span{flex:1;text-align:center;font-size:.6rem;color:var(--text-muted)}

/* ========== Settings Modal ========== */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:var(--radius);padding:24px;max-width:400px;width:100%;max-height:80vh;overflow-y:auto;animation:modalIn .3s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.modal h2{font-size:1.1rem;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.modal .setting-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
.modal .setting-item:last-child{border-bottom:none}
.modal .setting-label{font-size:.9rem;font-weight:500}
.modal .setting-label small{display:block;font-size:.75rem;color:var(--text-secondary);font-weight:400;margin-top:2px}
.modal .setting-control input[type="number"]{width:60px;padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);text-align:center;font-size:.9rem}
.modal .close-btn{width:100%;margin-top:16px}

/* ========== Toast ========== */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 20px;border-radius:var(--radius-sm);font-size:.85rem;z-index:300;animation:toastIn .3s ease;max-width:90%;text-align:center}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-20px)}to{opacity:1;transform:translate(-50%,0)}}

/* ========== Empty State ========== */
.empty-state{text-align:center;padding:40px 20px;color:var(--text-secondary)}
.empty-state .empty-icon{font-size:3rem;margin-bottom:12px}
.empty-state .empty-text{font-size:.95rem;margin-bottom:16px}

/* ========== Completion ========== */
.completion-screen{text-align:center;padding:40px 20px}
.completion-screen .completion-icon{font-size:4rem;margin-bottom:16px}
.completion-screen h2{font-size:1.4rem;color:var(--primary);margin-bottom:8px}
.completion-screen .completion-stats{display:flex;justify-content:center;gap:24px;margin:20px 0}
.completion-screen .completion-stat{text-align:center}
.completion-screen .completion-stat .val{font-size:1.5rem;font-weight:700;color:var(--primary)}
.completion-screen .completion-stat .lbl{font-size:.75rem;color:var(--text-secondary)}

/* ========== Responsive ========== */
@media(min-width:481px){
  .app-container{box-shadow:var(--shadow-lg)}
}
@media(max-width:360px){
  .word-text{font-size:1.8rem}
  .dashboard-stats{grid-template-columns:1fr 1fr}
  .stats-overview{grid-template-columns:repeat(3,1fr)}
}

/* ========== Scrollbar ========== */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* ========== Loading ========== */
.loading-spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* ========== Review result card ========== */
.result-card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.result-card .result-word{font-weight:700;font-size:1rem;flex:1}
.result-card .result-status{padding:3px 10px;border-radius:12px;font-size:.75rem;font-weight:600}
.result-card .result-status.mastered{background:#e8f8f0;color:var(--success)}
.result-card .result-status.learning{background:#fef3e2;color:var(--warning)}
.result-card .result-status.new{background:#f0f0f0;color:var(--text-secondary)}
</style>
</head>
<body>

<!-- ========== App Container ========== -->
<div class="app-container" id="app">

  <!-- ===== Dashboard Page ===== -->
  <div class="page active" id="page-dashboard">
    <div class="top-bar">
      <div>
        <h1>📖 VocabMaster</h1>
        <div class="subtitle" id="greeting-text">今天也要加油哦</div>
      </div>
      <div class="streak-badge" id="streak-badge">
        <span class="fire">🔥</span>
        <span id="streak-count">0</span>天
      </div>
    </div>

    <div class="checkin-section">
      <button class="checkin-btn" id="checkin-btn" onclick="handleCheckin()">
        <span class="checkin-icon">✅</span>
        <span id="checkin-text">打卡</span>
      </button>
      <div style="margin-top:10px;font-size:.8rem;color:var(--text-secondary)" id="checkin-status">今日尚未打卡</div>
    </div>

    <div class="dashboard-stats">
      <div class="stat-card">
        <div class="stat-icon">📝</div>
        <div class="stat-value" id="stat-new">0</div>
        <div class="stat-label">今日新学</div>
      </div>
      <div class="stat-card">

// ===== 应用状态管理 =====
// ========================================================================
const STORAGE_KEYS = {
  CURRENT_BOOK: 'vm_currentBook',
  WORD_PROGRESS: 'vm_wordProgress',
  CHECKIN_DATA: 'vm_checkinData',
  SETTINGS: 'vm_settings',
  LEARNING_STATE: 'vm_learningState'
};

// 默认设置
const DEFAULT_SETTINGS = {
  dailyNew: 10,
  dailyReview: 30
};

// 学习状态：new / learning / familiar / mastered
const STATUS = { NEW: 'new', LEARNING: 'learning', FAMILIAR: 'familiar', MASTERED: 'mastered' };

// 获取当前日期字符串 (YYYY-MM-DD)
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// 从 localStorage 加载数据
function loadData(key, defaultVal) {
  try {
    const d = localStorage.getItem(key);
    return d ? JSON.parse(d) : defaultVal;
  } catch(e) {
    return defaultVal;
  }
}

// 保存数据到 localStorage
function saveData(key, val) {
  try {
    localStorage.setItem(key, JSON.stringify(val));
  } catch(e) {
    console.warn('localStorage save failed:', e);
  }
}

// 获取当前词书ID
function getCurrentBookId() {
  return loadData(STORAGE_KEYS.CURRENT_BOOK, 'cet4');
}

// 设置当前词书
function setCurrentBookId(bookId) {
  saveData(STORAGE_KEYS.CURRENT_BOOK, bookId);
}

// 获取所有单词进度 { "cet4::abandon": { ... } }
function getAllProgress() {
  return loadData(STORAGE_KEYS.WORD_PROGRESS, {});
}

// 保存所有进度
function saveAllProgress(progress) {
  saveData(STORAGE_KEYS.WORD_PROGRESS, progress);
}

// 获取某个单词的进度
function getWordProgress(bookId, word) {
  const key = `${bookId}::${word}`;
  const all = getAllProgress();
  return all[key] || {
    status: STATUS.NEW,
    easeFactor: 2.5,
    interval: 0,
    repetitions: 0,
    nextReview: 0,
    lastReview: 0,
    learnDate: ''
  };
}

// 保存某个单词的进度
function setWordProgress(bookId, word, progress) {
  const key = `${bookId}::${word}`;
  const all = getAllProgress();
  all[key] = progress;
  saveAllProgress(all);
}

// 获取打卡数据 { "2024-01-15": { newWords: 5, reviewWords: 10, checked: true } }

  return loadData(STORAGE_KEYS.CHECKIN_DATA, {});
}

function saveCheckinData(data) {

}

// 获取设置
function getSettings() {

}

}

// ========================================================================
// ===== SM-2 间隔重复算法 =====
// ========================================================================
/**
 * SM-2 变体算法
 * quality: 0-5 评分
 *   5 = 完美回忆
 *   4 = 犹豫后正确
 *   3 = 困难但回忆起来
 *   2 = 错误但似曾相识
 *   1 = 错误，毫无印象
 *   0 = 完全不认识
 */
function sm2(progress, quality) {
  let { easeFactor, interval, repetitions } = progress;

  if (quality >= 3) {
    // 回忆成功
    if (repetitions === 0) {
      interval = 1; // 1天后
    } else if (repetitions === 1) {
      interval = 6; // 6天后
    } else {
      interval = Math.round(interval * easeFactor);
    }
    repetitions++;
  } else {
    // 回忆失败，重置
    repetitions = 0;
    interval = 1;
  }

  // 更新 ease factor
  easeFactor = easeFactor + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
  if (easeFactor < 1.3) easeFactor = 1.3;

  // 计算下次复习时间
  const now = Date.now();
  const nextReview = now + interval * 24 * 60 * 60 * 1000;

  // 更新状态
  let status = progress.status;
  if (status === STATUS.NEW) status = STATUS.LEARNING;
  else if (status === STATUS.LEARNING && quality >= 4 && repetitions >= 3) status = STATUS.FAMILIAR;
  else if (status === STATUS.FAMILIAR && quality >= 4 && repetitions >= 5) status = STATUS.MASTERED;
  // 如果答得太差，降级
  if (quality <= 1 && status === STATUS.MASTERED) status = STATUS.FAMILIAR;
  if (quality === 0 && status === STATUS.FAMILIAR) status = STATUS.LEARNING;

  return {
    ...progress,
    easeFactor,
    interval,
    repetitions,
    nextReview,
    lastReview: now,
    status
  };
}

// ========================================================================
// ===== 发音 (Web Speech API) =====
// ========================================================================
function speakWord(word, rate) {
  if (!('speechSynthesis' in window)) {
    showToast('您的浏览器不支持语音功能');
    return;
  }
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(word);
  utterance.lang = 'en-US';
  utterance.rate = rate || 0.85;
  utterance.pitch = 1;
  window.speechSynthesis.speak(utterance);
  return utterance;
}

// ========================================================================
// ===== Toast 提示 =====
// ========================================================================
function showToast(msg, duration) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), duration || 2000);
}

// ========================================================================
// ===== 导航 =====
// ========================================================================
let currentPage = 'dashboard';

function navigateTo(page) {
  // 如果点击"学习"，但还没有学习队列，则初始化
  if (page === 'learn') {
    startLearning();
    return;
  }

  currentPage = page;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(`page-${page}`).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelector(`.nav-item[data-page="${page}"]`)?.classList.add('active');

  // 渲染对应页面
  if (page === 'dashboard') renderDashboard();
  else if (page === 'review') renderReviewModes();
  else if (page === 'books') renderBooks();
  else if (page === 'stats') renderStats();
}

// ========================================================================
function renderDashboard() {
  const bookId = getCurrentBookId();
  const book = WORD_BOOKS[bookId];
  const progress = getAllProgress();
  const settings = getSettings();
  const checkinData = getCheckinData();
  const today = todayStr();

  // 问候语
  const hour = new Date().getHours();
  let greeting = '今天也要加油哦 💪';
  if (hour < 6) greeting = '夜深了，注意休息 🌙';
  else if (hour < 12) greeting = '早安，新的一天开始了 ☀️';
  else if (hour < 18) greeting = '下午好，继续加油 🌤️';
  else greeting = '晚上好，温故知新 🌙';
  document.getElementById('greeting-text').textContent = greeting;

  // 计算今日统计
  let todayNew = 0, todayReview = 0;
  const todayData = checkinData[today] || {};
  todayNew = todayData.newWords || 0;
  todayReview = todayData.reviewWords || 0;

  // 计算总学过/掌握
  let totalLearned = 0, totalMastered = 0;
  Object.keys(progress).forEach(key => {
    if (key.startsWith(bookId + '::')) {
      const p = progress[key];
      if (p.status !== STATUS.NEW) totalLearned++;
      if (p.status === STATUS.MASTERED) totalMastered++;
    }
  });

  document.getElementById('stat-new').textContent = todayNew;
  document.getElementById('stat-review').textContent = todayReview;
  document.getElementById('stat-total').textContent = totalLearned;
  document.getElementById('stat-mastered').textContent = totalMastered;

  // 计算待学新词数量
  const newWordsCount = getNewWordsQueue(bookId, settings.dailyNew).length;
  const reviewWordsCount = getReviewWordsQueue(bookId, settings.dailyReview).length;

  document.getElementById('task-new-count').textContent = newWordsCount;
  document.getElementById('task-new-desc').textContent = newWordsCount > 0 ? `今日还需学习 ${newWordsCount} 个新词` : '今日新词已学完 🎉';
  document.getElementById('task-review-count').textContent = reviewWordsCount;
  document.getElementById('task-review-desc').textContent = reviewWordsCount > 0 ? `有 ${reviewWordsCount} 个单词待复习` : '暂无待复习 🎉';

  // 打卡状态
  const checkinBtn = document.getElementById('checkin-btn');
  const checkinText = document.getElementById('checkin-text');
  const checkinStatus = document.getElementById('checkin-status');
  if (todayData.checked) {
    checkinBtn.classList.add('checked');
    checkinText.textContent = '已打卡';
    checkinStatus.textContent = `今日已打卡 · 新学${todayNew}词 · 复习${todayReview}词`;
  } else {
    checkinBtn.classList.remove('checked');
    checkinText.textContent = '打卡';
    if (todayNew > 0 || todayReview > 0) {
      checkinStatus.textContent = `完成学习后记得打卡哦`;
    } else {
      checkinStatus.textContent = '今日尚未打卡';
    }
  }

  // 连续打卡天数
  let streak = 0;
  const d = new Date();
  while (true) {
    const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if (checkinData[ds] && checkinData[ds].checked) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else {
      break;
    }
  }
  document.getElementById('streak-count').textContent = streak;
}

// 处理打卡
function handleCheckin() {
  const today = todayStr();
  const checkinData = getCheckinData();
  if (checkinData[today] && checkinData[today].checked) {
    showToast('今日已打卡 ✅');
    return;
  }
  const checkinBtn = document.getElementById('checkin-btn');
  checkinBtn.classList.add('checked');

  if (!checkinData[today]) {
    checkinData[today] = { newWords: 0, reviewWords: 0, checked: false };
  }
  checkinData[today].checked = true;
  saveCheckinData(checkinData);

  // 动画效果
  checkinBtn.style.transform = 'scale(1.15)';
  setTimeout(() => checkinBtn.style.transform = '', 300);
  showToast('打卡成功！继续加油 🔥');
  renderDashboard();
}

// 获取今日待学新词队列
function getNewWordsQueue(bookId, limit) {
  const book = WORD_BOOKS[bookId];
  if (!book) return [];
  const progress = getAllProgress();
  const queue = [];
  for (const w of book.words) {
    const key = `${bookId}::${w.word}`;
    if (!progress[key] || progress[key].status === STATUS.NEW) {
      queue.push(w);
      if (queue.length >= limit) break;
    }
  }
  return queue;
}

// 获取今日待复习单词队列
function getReviewWordsQueue(bookId, limit) {
  const book = WORD_BOOKS[bookId];
  if (!book) return [];
  const progress = getAllProgress();
  const now = Date.now();
  const queue = [];
  for (const w of book.words) {
    const key = `${bookId}::${w.word}`;
    const p = progress[key];
    if (p && p.status !== STATUS.NEW && p.nextReview <= now) {
      queue.push({ ...w, progress: p });
      if (queue.length >= limit) break;
    }
  }
  return queue;
}

let learnQueue = [];
let learnIndex = 0;
let learnFlipped = false;
let learnTodayNew = 0;

function startLearning() {
  const bookId = getCurrentBookId();
  const settings = getSettings();

  // 检查今日已学新词数
  const checkinData = getCheckinData();
  const today = todayStr();
  const todayData = checkinData[today] || {};
  const alreadyLearned = todayData.newWords || 0;
  const remaining = Math.max(0, settings.dailyNew - alreadyLearned);

  learnQueue = getNewWordsQueue(bookId, remaining);

  if (learnQueue.length === 0) {
    showToast('今日新词已学完！去复习吧 🔄');
    return;
  }

  learnIndex = 0;
  learnFlipped = false;
  learnTodayNew = 0;

  // 切换到学习页
  currentPage = 'learn';
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-learn').classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelector('.nav-item[data-page=\"learn\"]')?.classList.add('active');

  renderLearnCard();
}

function renderLearnCard() {
  if (learnIndex >= learnQueue.length) {
    finishLearning();
    return;
  }

  const w = learnQueue[learnIndex];
  learnFlipped = false;
  const total = learnQueue.length;

  document.getElementById('learn-progress').textContent = `${learnIndex + 1} / ${total}`;
  document.getElementById('learn-progress-bar').style.width = `${((learnIndex + 1) / total) * 100}%`;

  const container = document.getElementById('learn-card-container');
  container.innerHTML = `
    <div class="word-card" id="learn-word-card" onclick="flipLearnCard()">
      <div class="front">
        <div class="word-main">
          <div class="word-text">${w.word}</div>
          <div class="word-phonetic">${w.phonetic}</div>
          <span class="word-pos">${w.pos}</span>
          <div>
            <button class="word-speak-btn" onclick="event.stopPropagation(); speakWord('${w.word}')" title="播放发音">🔊</button>
          </div>
        </div>
        <div class="tap-hint">👆 点击翻转查看释义</div>
      </div>
      <div class="back">
        <div class="word-main">
          <div class="word-text">${w.word}</div>
          <div class="word-phonetic">${w.phonetic}</div>
        </div>
        <div class="word-detail">
          <div class="word-definition">${w.pos} ${w.def}</div>
          <div class="word-example">
            <div class="en">${w.ex}</div>
            <div class="zh">${w.exCn}</div>
          </div>
        </div>
        <div class="tap-hint">👆 点击翻转回正面</div>
      </div>
    </div>
  `;

  // 动作按钮
  document.getElementById('learn-actions-container').innerHTML = `
    <div class="learn-actions">
      <button class="btn btn-warning" onclick="markLearnWord('hard')">😟 困难</button>
      <button class="btn btn-primary" onclick="markLearnWord('normal')">😊 一般</button>
      <button class="btn btn-success" onclick="markLearnWord('easy')">😄 简单</button>
    </div>
  `;

  // 自动播放发音
  setTimeout(() => speakWord(w.word, 0.8), 300);
}

function flipLearnCard() {
  const card = document.getElementById('learn-word-card');
  if (!card) return;
  learnFlipped = !learnFlipped;
  if (learnFlipped) {
    card.classList.add('flipped');
  } else {
    card.classList.remove('flipped');
  }
}

function markLearnWord(level) {
  const w = learnQueue[learnIndex];
  const bookId = getCurrentBookId();

  // 获取当前进度
  let progress = getWordProgress(bookId, w.word);

  // 如果是新词，设置学习日期
  if (progress.status === STATUS.NEW) {
    progress.learnDate = todayStr();
  }

  // SM-2 评分映射：hard=2, normal=4, easy=5
  const qualityMap = { hard: 2, normal: 4, easy: 5 };
  progress = sm2(progress, qualityMap[level]);
  setWordProgress(bookId, w.word, progress);

  // 更新今日打卡数据
  const checkinData = getCheckinData();
  const today = todayStr();
  if (!checkinData[today]) checkinData[today] = { newWords: 0, reviewWords: 0, checked: false };
  checkinData[today].newWords = (checkinData[today].newWords || 0) + 1;
  saveCheckinData(checkinData);

  learnTodayNew++;
  learnIndex++;
  renderLearnCard();
}

function finishLearning() {
  const container = document.getElementById('learn-card-container');
  const actions = document.getElementById('learn-actions-container');
  container.innerHTML = `
    <div class="completion-screen">
      <div class="completion-icon">🎉</div>
      <h2>学习完成！</h2>
      <p style="color:var(--text-secondary);margin-top:8px">本轮学习了 ${learnTodayNew} 个新单词</p>
      <div class="completion-stats">
        <div class="completion-stat">
          <div class="val">${learnTodayNew}</div>
          <div class="lbl">新学单词</div>
        </div>
      </div>
      <div class="btn-group" style="justify-content:center;margin-top:20px">
        <button class="btn btn-outline" onclick="navigateTo('dashboard')">返回首页</button>
        <button class="btn btn-primary" onclick="navigateTo('review')">去复习</button>
      </div>
    </div>
  `;
  actions.innerHTML = '';
}

function exitLearning() {
  navigateTo('dashboard');
}

function startReview(mode) {

function renderReviewCard() {
  if (reviewIndex >= reviewQueue.length) {

  const w = reviewQueue[reviewIndex];
  const total = reviewQueue.length;

  document.getElementById('review-count').textContent = `${reviewIndex + 1} / ${total}`;

    renderListeningMode(area, w);

// 获取干扰选项（从当前词书取其他词的释义）
function getDistractors(bookId, currentWord, count) {
  const book = WORD_BOOKS[bookId];
  const others = book.words.filter(w => w.word !== currentWord);
  const shuffled = others.sort(() => Math.random() - 0.5);
  return shuffled.slice(0, count).map(w => w.def);
}

// ===== 选择题模式 =====
function renderChoiceMode(area, w) {
  const bookId = getCurrentBookId();
  const distractors = getDistractors(bookId, w.word, 3);
  const options = [w.def, ...distractors].sort(() => Math.random() - 0.5);
  const labels = ['A', 'B', 'C', 'D'];

  area.innerHTML = `
    <div class="review-card">
      <div class="review-question">
        ${w.word}
        <span class="phonetic-hint">${w.phonetic}</span>
      </div>
      <button class="word-speak-btn" style="margin:0 auto 16px" onclick="speakWord('${w.word}')">🔊</button>
      <div class="choices" id="choices-container">
        ${options.map((opt, i) => `
          <button class="choice-btn" onclick="checkChoice(this, '${escapeHtml(w.def)}', '${escapeHtml(opt)}')">
            <span class="choice-label">${labels[i]}</span>${opt}
          </button>
        `).join('')}
      </div>
      <div id="review-feedback-area"></div>
    </div>
  `;

  setTimeout(() => speakWord(w.word), 300);
}

function checkChoice(btn, correctDef, selectedDef) {
  const btns = document.querySelectorAll('#choices-container .choice-btn');
  // 防止重复点击
  if (btns[0].disabled) return;

  const isCorrect = selectedDef === correctDef;
  btn.disabled = true;

  // 标记所有按钮
  btns.forEach(b => {
    b.style.pointerEvents = 'none';
    // 找到正确答案并高亮
    if (b.textContent.includes(correctDef)) {
      b.classList.add('correct');
    }
  });

  if (!isCorrect) {
    btn.classList.add('wrong');
  }

  // 显示反馈
  const w = reviewQueue[reviewIndex];
  const feedbackArea = document.getElementById('review-feedback-area');
  feedbackArea.innerHTML = `
    <div class="review-feedback ${isCorrect ? 'correct' : 'wrong'}">
      <div class="feedback-word">${w.word} ${w.phonetic}</div>
      <div class="feedback-def">${w.pos} ${w.def}</div>
    </div>
    <div style="margin-top:12px">
      <button class="btn btn-primary btn-block" onclick="nextReviewCard(${isCorrect ? 4 : 1})">继续</button>
    </div>
  `;

  // 更新今日复习计数
  updateReviewCount();
}

// ===== 拼写模式 =====
function renderSpellingMode(area, w) {
  area.innerHTML = `
    <div class="review-card">
      <div class="review-question" style="flex-direction:column">
        <div style="font-size:.85rem;color:var(--text-secondary);margin-bottom:4px">根据释义拼写单词</div>
        <div style="font-size:1.1rem;font-weight:600">${w.pos} ${w.def}</div>
      </div>
      <div class="spelling-input">
        <input type="text" id="spelling-answer" placeholder="输入单词..." autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
      <button class="btn btn-primary btn-block" onclick="checkSpelling()" id="spelling-submit">确认</button>
      <div id="review-feedback-area"></div>
    </div>
  `;

  // 回车提交
  const input = document.getElementById('spelling-answer');
  input.focus();
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') checkSpelling();
  });
}

function checkSpelling() {
  const input = document.getElementById('spelling-answer');
  if (!input || input.disabled) return;

  const w = reviewQueue[reviewIndex];
  const answer = input.value.trim().toLowerCase();
  const correct = w.word.toLowerCase();

  const isCorrect = answer === correct;

  if (isCorrect) {
    input.classList.add('correct');
  } else {
    input.classList.add('wrong');
    input.value = correct;
  }
  input.disabled = true;

  const feedbackArea = document.getElementById('review-feedback-area');
  feedbackArea.innerHTML = `
    <div class="review-feedback ${isCorrect ? 'correct' : 'wrong'}">
      <div class="feedback-word">${w.word} ${w.phonetic}</div>
      <div class="feedback-def">${w.pos} ${w.def}</div>
      ${!isCorrect ? `<div style="margin-top:4px;font-size:.8rem">例句：${w.ex}</div>` : ''}
    </div>
    <div style="margin-top:12px">
      <button class="btn btn-primary btn-block" onclick="nextReviewCard(${isCorrect ? 4 : 1})">继续</button>
    </div>
  `;

  updateReviewCount();
}

// ===== 听音辨意模式 =====
function renderListeningMode(area, w) {
  const bookId = getCurrentBookId();
  const distractors = getDistractors(bookId, w.word, 3);
  const options = [w.def, ...distractors].sort(() => Math.random() - 0.5);
  const labels = ['A', 'B', 'C', 'D'];

  area.innerHTML = `
    <div class="review-card">
      <button class="listen-btn-large" onclick="speakWord('${w.word}', 0.7)" id="listen-play-btn">

        <span class="listen-text">点击播放发音</span>

            <span class="choice-label">${labels[i]}</span>${opt}
          </button>
        `).join('')}
      </div>
      <div id="review-feedback-area"></div>
    </div>
  `;

  setTimeout(() => speakWord(w.word, 0.7), 500);
}

function nextReviewCard(quality) {
  const w = reviewQueue[reviewIndex];
  const bookId = getCurrentBookId();

  // SM-2 更新
  let progress = w.progress || getWordProgress(bookId, w.word);
  progress = sm2(progress, quality);
  setWordProgress(bookId, w.word, progress);

  // 记录结果
  reviewResults.push({
    word: w.word,
    correct: quality >= 3,
    quality
  });

  reviewIndex++;
  renderReviewCard();
}

function updateReviewCount() {
  const checkinData = getCheckinData();
  const today = todayStr();
  if (!checkinData[today]) checkinData[today] = { newWords: 0, reviewWords: 0, checked: false };
  // 延迟到 nextReviewCard 时统一计数，这里不做更新
}

function finishReview() {
  // 更新复习计数
  const checkinData = getCheckinData();
  const today = todayStr();
  if (!checkinData[today]) checkinData[today] = { newWords: 0, reviewWords: 0, checked: false };
  checkinData[today].reviewWords = (checkinData[today].reviewWords || 0) + reviewResults.length;
  saveCheckinData(checkinData);

  // 显示完成页面
  const correctCount = reviewResults.filter(r => r.correct).length;
  const total = reviewResults.length;

      <h2>复习完成！</h2>
      <div class="completion-stats">
        <div class="completion-stat">
          <div class="val">${total}</div>
          <div class="lbl">复习单词</div>
        </div>
        <div class="completion-stat">
          <div class="val">${correctCount}</div>
          <div class="lbl">回答正确</div>
        </div>
        <div class="completion-stat">
          <div class="val">${accuracy}%</div>
          <div class="lbl">正确率</div>
        </div>
      </div>
      <div style="margin-top:16px">
        ${reviewResults.map(r => `
          <div class="result-card">
            <span class="result-word">${r.word}</span>

function exitReview() {

// HTML转义辅助
function escapeHtml(str) {
  return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function renderBooks() {
  const currentBookId = getCurrentBookId();
  const progress = getAllProgress();

  const booksDiv = document.getElementById('books-list');
  booksDiv.innerHTML = '';

  Object.values(WORD_BOOKS).forEach(book => {
    const totalWords = book.words.length;
    let learned = 0, mastered = 0;
    book.words.forEach(w => {
      const key = `${book.id}::${w.word}`;
      const p = progress[key];
      if (p && p.status !== STATUS.NEW) learned++;
      if (p && p.status === STATUS.MASTERED) mastered++;
    });
    const pct = totalWords > 0 ? Math.round((learned / totalWords) * 100) : 0;

    const isActive = book.id === currentBookId;
    const isCompleted = pct === 100;

    const card = document.createElement('div');
    card.className = `book-card ${isActive ? 'active' : ''}`;
    card.onclick = () => selectBook(book.id);
    card.innerHTML = `
      <div class="book-icon">${book.icon}</div>
      <div class="book-info">
        <div class="book-name">${book.name}</div>
        <div class="book-desc">${book.desc}</div>
        <div class="progress-bar" style="margin-top:6px">
          <div class="fill" style="width:${pct}%"></div>
        </div>
        <div class="book-progress">已学 ${learned}/${totalWords} · 掌握 ${mastered} · ${pct}%</div>
      </div>
      <span class="book-status ${isActive ? 'using' : ''} ${isCompleted ? 'completed' : ''}">${isActive ? '使用中' : isCompleted ? '已完成' : '选择'}</span>
    `;
    booksDiv.appendChild(card);
  });
}

function selectBook(bookId) {
  if (getCurrentBookId() !== bookId) {
    setCurrentBookId(bookId);
    showToast(`已切换到 ${WORD_BOOKS[bookId].name}`);
    renderBooks();
  }
}

// ===== 统计页面 =====
// ========================================================================
let statsCalendarMonth = new Date().getMonth();
let statsCalendarYear = new Date().getFullYear();

function renderStats() {
  const bookId = getCurrentBookId();
  const book = WORD_BOOKS[bookId];
  const progress = getAllProgress();
  const checkinData = getCheckinData();

  // 概览统计
  let totalLearned = 0, totalMastered = 0, totalFamiliar = 0, totalLearning = 0;
  book.words.forEach(w => {
    const key = `${bookId}::${w.word}`;
    const p = progress[key];
    if (p) {
      if (p.status !== STATUS.NEW) totalLearned++;
      if (p.status === STATUS.MASTERED) totalMastered++;
      if (p.status === STATUS.FAMILIAR) totalFamiliar++;
      if (p.status === STATUS.LEARNING) totalLearning++;
    }
  });

  // 总打卡天数
  const totalDays = Object.values(checkinData).filter(d => d.checked).length;

  document.getElementById('stats-overview').innerHTML = `
    <div class="stat-item"><div class="stat-val">${totalDays}</div><div class="stat-lbl">学习天数</div></div>
    <div class="stat-item"><div class="stat-val">${totalLearned}</div><div class="stat-lbl">已学单词</div></div>
    <div class="stat-item"><div class="stat-val">${totalMastered}</div><div class="stat-lbl">已掌握</div></div>
  `;

  // 掌握程度分布
  const total = book.words.length;
  const newCount = total - totalLearned;
  const learningCount = totalLearning;
  const familiarCount = totalFamiliar;
  const masteredCount = totalMastered;

  const masteryBar = document.getElementById('mastery-bar');
  masteryBar.innerHTML = `
    <div class="seg new" style="width:${(newCount/total)*100}%" title="未学 ${newCount}"></div>
    <div class="seg learning" style="width:${(learningCount/total)*100}%" title="学习中 ${learningCount}"></div>
    <div class="seg familiar" style="width:${(familiarCount/total)*100}%" title="熟悉 ${familiarCount}"></div>
    <div class="seg mastered" style="width:${(masteredCount/total)*100}%" title="已掌握 ${masteredCount}"></div>
  `;

  document.getElementById('mastery-legend').innerHTML = `
    <div class="legend-item"><span class="legend-dot new"></span>未学 ${newCount}</div>
    <div class="legend-item"><span class="legend-dot learning"></span>学习中 ${learningCount}</div>
    <div class="legend-item"><span class="legend-dot familiar"></span>熟悉 ${familiarCount}</div>
    <div class="legend-item"><span class="legend-dot mastered"></span>已掌握 ${masteredCount}</div>
  `;

  // 日历
  renderCalendar();

  // 近7日图表
  renderDailyChart();
}

function renderCalendar() {
  const checkinData = getCheckinData();
  const year = statsCalendarYear;
  const month = statsCalendarMonth;

  document.getElementById('calendar-month').textContent = `${year}年${month + 1}月`;

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const today = new Date();
  const todayStr_ = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

  let html = '';
  const dayLabels = ['日','一','二','三','四','五','六'];
  dayLabels.forEach(l => html += `<div class="day-label">${l}</div>`);

  // 空白格
  for (let i = 0; i < firstDay; i++) {
    html += `<div class="day-cell empty"></div>`;
  }

  // 日期格
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isChecked = checkinData[ds] && checkinData[ds].checked;
    const isToday = ds === todayStr_;
    let cls = 'day-cell';
    if (isChecked) cls += ' checked';
    if (isToday) cls += ' today';
    html += `<div class="${cls}" title="${isChecked ? '已打卡' : ''}">${d}</div>`;
  }

  document.getElementById('calendar-grid').innerHTML = html;
}

function changeMonth(delta) {
  statsCalendarMonth += delta;
  if (statsCalendarMonth > 11) { statsCalendarMonth = 0; statsCalendarYear++; }
  if (statsCalendarMonth < 0) { statsCalendarMonth = 11; statsCalendarYear--; }
  renderCalendar();
}

function renderDailyChart() {
  const checkinData = getCheckinData();
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const data = checkinData[ds] || { newWords: 0, reviewWords: 0 };
    days.push({
      label: `${d.getMonth()+1}/${d.getDate()}`,
      count: (data.newWords || 0) + (data.reviewWords || 0)
    });
  }

  const max = Math.max(...days.map(d => d.count), 1);
  const chartDiv = document.getElementById('daily-chart');
  const labelsDiv = document.getElementById('daily-chart-labels');

  chartDiv.innerHTML = days.map(d => {
    const h = Math.max(2, (d.count / max) * 100);
    return `<div class="chart-bar" style="height:${h}%" title="${d.count}词"></div>`;
  }).join('');

  labelsDiv.innerHTML = days.map(d => `<span>${d.label}</span>`).join('');
}

// ========================================================================
// ===== 设置 =====
// ========================================================================
function showSettings() {
  const settings = getSettings();
  document.getElementById('setting-daily-new').value = settings.dailyNew;
  document.getElementById('setting-daily-review').value = settings.dailyReview;
  document.getElementById('settings-modal').classList.add('show');
}

function saveSettings() {
  const dailyNew = parseInt(document.getElementById('setting-daily-new').value) || 10;
  const dailyReview = parseInt(document.getElementById('setting-daily-review').value) || 30;
  saveSettingsData({ dailyNew: Math.max(5, Math.min(50, dailyNew)), dailyReview: Math.max(10, Math.min(100, dailyReview)) });
  document.getElementById('settings-modal').classList.remove('show');
  showToast('设置已保存');
  renderDashboard();
}

function resetAllData() {
  if (confirm('确定要清除所有学习数据吗？此操作不可恢复！')) {
    localStorage.removeItem(STORAGE_KEYS.WORD_PROGRESS);
    localStorage.removeItem(STORAGE_KEYS.CHECKIN_DATA);
    localStorage.removeItem(STORAGE_KEYS.LEARNING_STATE);
    document.getElementById('settings-modal').classList.remove('show');
    showToast('学习数据已重置');
    renderDashboard();
  }
}

// 点击模态框外部关闭
document.getElementById('settings-modal').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('show');
});

// ========================================================================
// ===== 初始化 =====
// ========================================================================
function init() {
  // 确保 settings 存在
  if (!localStorage.getItem(STORAGE_KEYS.SETTINGS)) {
    saveSettingsData(DEFAULT_SETTINGS);
  }

  renderDashboard();
}

// 启动
init();
</script>
